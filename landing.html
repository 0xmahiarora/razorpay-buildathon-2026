  <script src="/ _sdk/5629ea66dc55d54f.editing_sdk.js" integrity="sha512-snPYzGvgiTEMUBOb+HlCBkFeiM0IRX4hcgA78wvalhC0WnJtaX+RCbosPWtNqZsZ7sZ9NwN0oePZYa+IlMwa+w=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      const cards = document.querySelectorAll("[data-agent]");
      const activityFeed = document.getElementById("activity-feed");
      const commandForm = document.getElementById("command-form");
      const commandInput = document.getElementById("agent-command");
      const pauseButton = document.getElementById("pause-button");
      function timestamp() {
        return new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false }) + " IST";
      }
      function addFeedItem(message) {
        const entry = document.createElement("div");
        entry.className = "feed-line new-feed";
        const time = document.createElement("p");
        time.className = "mono text-[9px] text-amber-100/55";
        time.textContent = timestamp();
        const text = document.createElement("p");
        text.className = "text-sm text-stone-200 mt-1";
        text.textContent = message;
        entry.append(time, text);
        activityFeed.appendChild(entry);
      }
      function selectAgent(card) {
        cards.forEach(item => item.classList.toggle("is-selected", item === card));
        addFeedItem(card.dataset.agent.charAt(0).toUpperCase() + card.dataset.agent.slice(1) + " agent is now prioritised in the operating queue.");
      }
      cards.forEach(card => {
        card.addEventListener("click", () => selectAgent(card));
      });
      document.getElementById("apply-flow-button").addEventListener("click", () => {
        const growthCard = document.querySelector('[data-agent="growth"]');
        growthCard.classList.add("is-selected");
        cards.forEach(card => {
          if (card !== growthCard) card.classList.remove("is-selected");
        });
        addFeedItem("Growth flow activated: high-intent audience cohort sent to the agent queue.");
        growthCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      pauseButton.addEventListener("click", () => {
        const paused = pauseButton.classList.toggle("is-paused");
        addFeedItem(paused ? "Automation paused. Existing customer journeys remain safely monitored." : "Automation resumed. Agentic commerce routing is live again.");
      });
      commandForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const command = commandInput.value.trim();
        if (!command) return;
        addFeedItem("Operator instruction received: " + command);
        addFeedItem("Agent acknowledgement: instruction placed into the monitored commerce queue.");
        commandInput.value = "";
      });
    });
  </script>
